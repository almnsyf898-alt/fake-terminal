<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚠️ إنذار أمني ⚠️</title>
  <style>
    body {
      background-color: #050000;
      color: #ff0000;
      font-family: monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      overflow-x: hidden;
    }
    .alert-box {
      border: 3px solid #ff0000;
      padding: 15px;
      background-color: rgba(255, 0, 0, 0.15);
      box-shadow: 0 0 20px #ff0000;
      animation: blink 0.8s infinite alternate;
      width: 90%;
      max-width: 500px;
      border-radius: 8px;
    }
    @keyframes blink {
      0% { border-color: #ff0000; box-shadow: 0 0 10px #ff0000; }
      100% { border-color: #550000; box-shadow: 0 0 25px #ff0000; }
    }
    h1 { font-size: 22px; margin: 0 0 10px 0; color: #ff0000; }
    .repeating-container {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.8;
      color: #ff2222;
      word-wrap: break-word;
    }
  </style>
</head>
<body>

  <div class="alert-box">
    <h1>⚠️ إنذار أمني عاجل ⚠️</h1>
    <p>[!] تم اختراق الهاتف!</p>
  </div>

  <div class="repeating-container" id="stream"></div>

  <script>
    const myName = "السفاح";
    const container = document.getElementById("stream");
    let text = "";
    for (let i = 0; i < 150; i++) {
      text += `🚨 تم الاختراق بواسطة: ${myName} 🚨 &nbsp; `;
    }
    container.innerHTML = text;
  </script>
</body>
</html>
