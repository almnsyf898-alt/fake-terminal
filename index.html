<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة العوالم المظلمة</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #e0e0e0;
            --accent-color: #8a2be2;
            --glow: 0 0 10px var(--accent-color), 0 0 20px var(--accent-color);
        }

        body.theme-blood {
            --bg-color: #0a0000;
            --text-color: #ffcccc;
            --accent-color: #cc0000;
        }

        body.theme-abyss {
            --bg-color: #00050a;
            --text-color: #ccffff;
            --accent-color: #0066cc;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow-x: hidden;
            transition: all 0.5s ease;
        }

        /* شاشة الدخول */
        #intro-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            z-index: 100;
            position: absolute;
            width: 100%;
        }

        h1 {
            text-shadow: var(--glow);
            letter-spacing: 2px;
        }

        input {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            padding: 10px 20px;
            font-size: 18px;
            text-align: center;
            outline: none;
            box-shadow: var(--glow);
            margin: 20px;
            transition: 0.3s;
        }

        input:focus {
            box-shadow: 0 0 30px var(--accent-color);
        }

        button {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 30px;
            font-size: 18px;
            cursor: pointer;
            text-shadow: var(--glow);
            box-shadow: var(--glow);
            transition: 0.3s;
        }

        button:hover {
            background: var(--accent-color);
            color: #000;
        }

        /* المحتوى الرئيسي */
        #main-content {
            display: none;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        select {
            background: #000;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 5px;
            outline: none;
        }

        /* الاقتباسات */
        .quote-card {
            background: rgba(255, 255, 255, 0.02);
            border-right: 4px solid var(--accent-color);
            padding: 20px;
            margin-bottom: 20px;
            animation: fadeIn 1s ease-in-out;
            position: relative;
        }

        .quote-text {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .engagement {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: #888;
        }

        .like-btn {
            cursor: pointer;
            transition: 0.2s;
        }

        .like-btn:hover {
            color: var(--accent-color);
        }

        /* الحكيم / الروبوت */
        #wise-man {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--accent-color);
            padding: 15px;
            border-radius: 10px;
            box-shadow: var(--glow);
            max-width: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: float 4s ease-in-out infinite;
        }

        #wise-shape {
            font-size: 40px;
            margin-bottom: 10px;
            transition: 0.5s;
        }

        #wise-text {
            font-size: 0.9rem;
        }

        /* الصندوق السحري */
        #magic-box {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: transparent;
            border: 2px solid var(--accent-color);
            cursor: pointer;
            animation: spin 6s linear infinite, pulseGlow 2s infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        /* التأثيرات الحركية */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: var(--glow); } 50% { box-shadow: 0 0 40px var(--accent-color); } }
    </style>
</head>
<body>

    <!-- شاشة الدخول -->
    <div id="intro-screen">
        <h1 id="welcome-text">مرحباً بك في البعد المظلم</h1>
        <input type="text" id="nickname" placeholder="أدخل لقبك للعبور..." autocomplete="off" />
        <button onclick="enterSite()">دخول</button>
    </div>

    <!-- المحتوى الرئيسي -->
    <div id="main-content">
        <header>
            <h2 id="user-greeting">الظلام يرحب بك</h2>
            <div>
                <input type="text" id="search-bar" placeholder="ابحث في أروقة العدم..." onkeyup="filterQuotes()" />
                <select id="theme-switcher" onchange="changeTheme()">
                    <option value="default">الفراغ الأرجواني</option>
                    <option value="blood">النزيف القرمزي</option>
                    <option value="abyss">الهاوية الزرقاء</option>
                </select>
            </div>
        </header>

        <main id="quotes-container">
            <!-- سيتم توليد الاقتباسات هنا عبر جافاسكربت -->
        </main>

        <!-- الحكيم المتحرك -->
        <div id="wise-man">
            <div id="wise-shape">👁️</div>
            <div id="wise-text">أنا أراقبك...</div>
        </div>

        <!-- الصندوق السحري -->
        <div id="magic-box" onclick="openCreatorBox()" title="بوابة المطور">✥</div>
    </div>

    <script>
        // قاعدة بيانات الاقتباسات السوداوية
        const quotes = [
            "نحن نولد في الظلام، وكل ما نفعله طوال حياتنا هو محاولة إيجاد شرارة.",
            "الوحوش الحقيقية لا تختبئ تحت سريرك، بل تسكن في صدى أفكارك.",
            "العدم ليس فارغاً كما تظن، بل هو ممتلئ بكل الأشياء التي فقدناها.",
            "ابتسم، فالنهاية تقترب بخطوات أهدأ من دقات قلبك.",
            "المأساة ليست في الموت، بل في الأشياء التي تموت بداخلنا ونحن ما زلنا نتنفس.",
            "نحن مجرد أشباح مؤقتة، تعتقد أنها تمتلك العالم.",
            "الضوء كذبة اخترعها الخائفون لكي يناموا."
        ];

        // أسئلة وأشكال الحكيم
        const wiseManPhrases = [
            "هل أنت متأكد أنك مستيقظ الآن؟",
            "الزمن يتآكل، ماذا فعلت اليوم؟",
            "إذا نظرت طويلاً في الهاوية، فإن الهاوية تنظر إليك أيضاً.",
            "لماذا تتمسك بأشياء ستزول؟",
            "هل الصمت الذي تسمعه الآن هو حقاً صمت؟"
        ];
        const wiseManShapes = ["👁️", "🦉", "🕸️", "🤖", "🌑", "⚕️"];

        function enterSite() {
            const nickname = document.getElementById('nickname').value.trim();
            if (nickname === "") return;

            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('user-greeting').innerText = `الظلام يرحب بك، ${nickname}`;
            
            renderQuotes();
            startFakeEngagement();
            startWiseMan();
        }

        function renderQuotes() {
            const container = document.getElementById('quotes-container');
            container.innerHTML = '';
            
            quotes.forEach((quote, index) => {
                // توليد أرقام تفاعل وهمية عالية لتبدو مشهورة
                const fakeLikes = Math.floor(Math.random() * 5000) + 1000;
                const fakeShares = Math.floor(Math.random() * 500) + 50;

                const quoteHTML = `
                    <div class="quote-card">
                        <div class="quote-text">"${quote}"</div>
                        <div class="engagement">
                            <span class="like-btn" onclick="addLike(this)">👁️ إعجاب (<span class="like-count">${fakeLikes}</span>)</span>
                            <span>🔗 مشاركة (${fakeShares})</span>
                        </div>
                    </div>
                `;
                container.innerHTML += quoteHTML;
            });
        }

        // تفاعل تفاعلي مباشر
        function addLike(element) {
            const countSpan = element.querySelector('.like-count');
            let count = parseInt(countSpan.innerText);
            countSpan.innerText = count + 1;
            element.style.color = "var(--accent-color)";
        }

        // تفاعل تلقائي وهمي (العدادات تزيد من تلقاء نفسها لتبدو حية)
        function startFakeEngagement() {
            setInterval(() => {
                const likeCounts = document.querySelectorAll('.like-count');
                if (likeCounts.length > 0) {
                    const randomQuote = likeCounts[Math.floor(Math.random() * likeCounts.length)];
                    let currentLikes = parseInt(randomQuote.innerText);
                    randomQuote.innerText = currentLikes + Math.floor(Math.random() * 3) + 1;
                }
            }, 3000);
        }

        // محرك البحث عن الاقتباسات
        function filterQuotes() {
            const searchTerm = document.getElementById('search-bar').value.toLowerCase();
            const cards = document.querySelectorAll('.quote-card');
            
            cards.forEach(card => {
                const text = card.querySelector('.quote-text').innerText.toLowerCase();
                if (text.includes(searchTerm)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }

        // تغيير مظهر الموقع
        function changeTheme() {
            const theme = document.getElementById('theme-switcher').value;
            document.body.className = '';
            if (theme !== 'default') {
                document.body.classList.add(`theme-${theme}`);
            }
        }

        // منطق الحكيم/الروبوت المتحرك
        function startWiseMan() {
            setInterval(() => {
                const shape = document.getElementById('wise-shape');
                const text = document.getElementById('wise-text');
                
                // تغيير الشكل والنص عشوائياً
                shape.innerText = wiseManShapes[Math.floor(Math.random() * wiseManShapes.length)];
                text.innerText = wiseManPhrases[Math.floor(Math.random() * wiseManPhrases.length)];
                
                // تأثير بصري عند التغيير
                shape.style.transform = `scale(1.2) rotate(${Math.random() * 20 - 10}deg)`;
                setTimeout(() => shape.style.transform = "scale(1) rotate(0)", 500);
            }, 7000); // يتغير كل 7 ثواني
        }

        // الصندوق السحري للمطور
        function openCreatorBox() {
            window.open('https://www.facebook.com/LONLY8', '_blank');
        }
    </script>
</body>
</html>
