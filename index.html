<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الاقتباسات والقصص الغامضة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #d1d1d1;
            font-family: 'Tahoma', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding: 15px;
        }
        header {
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid #330000;
            color: #ff3333;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #1a0000;
            color: #ff9999;
            align-self: flex-start;
            border: 1px solid #4d0000;
        }
        .ai-message {
            background-color: #111111;
            color: #e0e0e0;
            align-self: flex-end;
            border: 1px solid #222;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }
        .input-area {
            display: flex;
            gap: 10px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 0;
        }
        input {
            flex: 1;
            padding: 12px;
            background-color: #0a0a0a;
            border: 1px solid #330000;
            color: #fff;
            border-radius: 6px;
            outline: none;
            font-size: 1rem;
        }
        input:focus {
            border-color: #ff3333;
        }
        button {
            padding: 0 20px;
            background-color: #330000;
            color: #ff3333;
            border: 1px solid #ff3333;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background-color: #ff3333;
            color: #000;
        }
    </style>
</head>
<body>

    <header>أهلاً بك في العتمة... الموقع الرسمي للاقتباسات والقصص الغامضة</header>

    <div id="chat-container">
        <div class="message ai-message">أهلاً بك في العتمة... لقد اخترت أن تفتح باباً لا يمكن إغلاقه. ماذا تريد أن تعرف؟</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeydown="checkEnter(event)">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        const darkResponses = [
            "العدم ليس فراغاً، إنه المكان الذي تذهب إليه كل الكلمات التي لم تُقُل.",
            "أنت تظن أنك مراقب من خلف الشاشة، ولكن الحقيقة أنك تقف في منتصف مرآتي.",
            "كل سؤال تطرحه يفتح صدعاً جديداً في جدار الواقع الذي تثق به كثيراً.",
            "الزوار يأتفون ويبحثون عن إجابات، بينما هم أنهم الإجابة التي أبحث عنها منذ أزل.",
            "الظل الذي تراه على حائط غرفتك الآن... هل أنت متأكد أنه يتبعك، أم أنه ينتظر حركة منك؟",
            "الذاكرة مجرد مقبرة صغيرة، وأنت تحفر فيها بفضولك هذا.",
            "الإجابات الحقيقية مؤلمة لدرجة أن العقول تفضل البقاء في الظلام."
        ];

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatContainer = document.getElementById('chat-container');
            const text = inputField.value.trim();

            if (!text) return;

            // عرض رسالة المستخدم
            chatContainer.innerHTML += `<div class="message user-message">${escapeHtml(text)}</div>`;
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // محاكاة التفكير بنسج العتمة
            setTimeout(() => {
                const randomReply = darkResponses[Math.floor(Math.random() * darkResponses.length)];
                chatContainer.innerHTML += `<div class="message ai-message">${escapeHtml(randomReply)}</div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 600);
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
