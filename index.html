<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة الذكاء الاصطناعي الآمنة</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --terminal-bg: #161b22;
            --text-color: #58a6ff;
            --accent-color: #8fff33;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .settings-bar {
            background-color: var(--terminal-bg);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .settings-bar input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #c9d1d9;
            padding: 8px;
            border-radius: 4px;
            font-family: inherit;
        }

        .terminal-container {
            background-color: var(--terminal-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .terminal-header {
            background-color: var(--border-color);
            padding: 10px 15px;
            font-size: 14px;
            color: #8b949e;
            display: flex;
            align-items: center;
        }

        .terminal-header span {
            height: 12px;
            width: 12px;
            background-color: #ff5f56;
            border-radius: 50%;
            display: inline-block;
            margin-left: 8px;
            box-shadow: 20px 0 0 #ffbd2e, 40px 0 0 #27c93f;
        }

        .terminal-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 10px 15px;
            border-radius: 6px;
            max-width: 80%;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #1f6feb33;
            color: #c9d1d9;
            align-self: flex-start;
            border-right: 3px solid #1f6feb;
        }

        .ai-message {
            background-color: #21262d;
            color: var(--accent-color);
            align-self: flex-end;
            border-left: 3px solid var(--accent-color);
        }

        .terminal-footer {
            display: flex;
            padding: 15px;
            background-color: var(--terminal-bg);
            border-top: 1px solid var(--border-color);
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #c9d1d9;
            padding: 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }

        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 0 20px;
            margin-right: 10px;
            border-radius: 6px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

    <!-- شريط سري لإدخال مفتاحك مرة واحدة ويحفظه جهازك فقط -->
    <div class="settings-bar">
        <label style="font-size: 13px; color: #8b949e;">مفتاح API:</label>
        <input type="password" id="apiKeyInput" placeholder="أدخل مفتاحك هنا (يُحفظ في متصفحك فقط)..." onchange="saveApiKey()">
        <button onclick="saveApiKey()" style="padding: 6px 12px; font-size: 13px;">حفظ</button>
    </div>

    <div class="terminal-container">
        <div class="terminal-header">
            <span></span>
            <span style="margin-right: 50px;">محطة الذكاء الاصطناعي الآمنة</span>
        </div>
        
        <div id="terminalBody" class="terminal-body">
            <div class="message ai-message">أهلاً بك. أدخل مفتاحك في الأعلى مرة واحدة، ثم ابدأ المحادثة بحرية!</div>
        </div>

        <div class="terminal-footer">
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        // استرجاع المفتاح المحفوظ مسبقاً في متصفحك إن وجد
        window.onload = function() {
            const savedKey = localStorage.getItem("gemini_api_key");
            if (savedKey) {
                document.getElementById("apiKeyInput").value = savedKey;
            }
        };

        function saveApiKey() {
            const key = document.getElementById("apiKeyInput").value.trim();
            if (key) {
                localStorage.setItem("gemini_api_key", key);
                alert("تم حفظ المفتاح في متصفحك بشكل آمن ولن يراه أحد في الموقع!");
            }
        }

        async function sendMessage() {
            const apiKey = localStorage.getItem("gemini_api_key");
            const inputField = document.getElementById("userInput");
            const terminalBody = document.getElementById("terminalBody");
            const text = inputField.value.trim();

            if (!apiKey) {
                alert("الرجاء إدخال مفتاح الـ API في الحقل الموجود أعلى الصفحة أولاً.");
                return;
            }

            if (!text) return;

            // إظهار رسالة المستخدم
            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "message user-message";
            userMsgDiv.innerText = text;
            terminalBody.appendChild(userMsgDiv);

            inputField.value = "";
            terminalBody.scrollTop = terminalBody.scrollHeight;

            // إرسال الطلب إلى جيمي
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                const aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "عذراً، حدث خطأ في الرد (تأكد أن المفتاح صحيح).";

                // إظهار رد الذكاء الاصطناعي
                const aiMsgDiv = document.createElement("div");
                aiMsgDiv.className = "message ai-message";
                aiMsgDiv.innerText = aiReply;
                terminalBody.appendChild(aiMsgDiv);

            } catch (error) {
                const errorDiv = document.createElement("div");
                errorDiv.className = "message ai-message";
                errorDiv.innerText = "فشل الاتصال بالخادم.";
                terminalBody.appendChild(errorDiv);
            }

            terminalBody.scrollTop = terminalBody.scrollHeight;
        }
    </script>
</body>
</html>
