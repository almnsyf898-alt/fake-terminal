<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مملكة الفراعنة السوداء | Dark Pharaohs</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@450;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #050508;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --pharaoh-black: #111116;
      --glass-bg: rgba(15, 15, 22, 0.85);
      --border-gold: rgba(212, 175, 55, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #e2e8f0;
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 80px;
    }

    /* خلفية الفضاء والنجوم */
    #bgCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* ⚰️ التابوت المضيء (رابط الفيسبوك للمصمم) */
    .coffin-widget {
      position: fixed;
      left: 20px;
      bottom: 25px;
      z-index: 999;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .coffin-widget:hover {
      transform: scale(1.15) rotate(-5deg);
    }

    .coffin-icon {
      width: 50px;
      height: 70px;
      background: linear-gradient(145deg, #1f1a24, #08060c);
      border: 2px solid var(--gold);
      clip-path: polygon(25% 0%, 75% 0%, 100% 35%, 80% 100%, 20% 100%, 0% 35%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
    }

    .coffin-label {
      font-size: 11px;
      background: rgba(0, 0, 0, 0.8);
      color: var(--gold);
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.4);
    }

    /* نافذة التابوت المنبثقة */
    .coffin-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .coffin-modal-card {
      background: linear-gradient(135deg, #12091f, #05030a);
      border: 2px solid var(--gold);
      border-radius: 20px;
      padding: 35px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.25);
    }

    .fb-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #1877f2, #0056b3);
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 15px;
      margin-top: 20px;
      box-shadow: 0 4px 20px rgba(24, 119, 242, 0.4);
    }

    /* هيكل التطبيق */
    .app-container {
      width: 100%;
      max-width: 720px;
      margin-top: 40px;
      padding: 0 15px;
      z-index: 10;
    }

    .card {
      background: var(--glass-bg);
      border: 1px solid var(--border-gold);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      margin-bottom: 25px;
    }

    .quote-display {
      text-align: center;
      padding: 35px 20px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 18px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      margin-bottom: 20px;
    }

    .quote-text {
      font-family: 'Amiri', serif;
      font-size: 24px;
      line-height: 1.8;
      color: var(--gold-light);
      margin-bottom: 15px;
    }

    .btn {
      padding: 12px 20px;
      background: linear-gradient(135deg, #222, #111);
      border: 1px solid var(--gold);
      border-radius: 12px;
      color: var(--gold);
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: var(--gold);
      color: #000;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
    }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
      font-family: inherit;
    }

    /* 🤖 الروبوتات الفرعونية المتجولة والقابلة للسحب باليد */
    .pharaoh-robot {
      position: fixed;
      width: 75px;
      height: 85px;
      z-index: 900;
      cursor: grab;
      touch-action: none;
      transition: transform 0.1s ease;
    }

    .pharaoh-robot:active {
      cursor: grabbing;
    }

    .pharaoh-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, var(--pharaoh-black), #000);
      border: 2px solid var(--gold);
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* القبعة الفرعونية (النمس الأسود والذهبي) */
    .pharaoh-hat {
      position: absolute;
      top: -16px;
      width: 85px;
      height: 25px;
      background: linear-gradient(90deg, #111, var(--gold), #111);
      border-radius: 10px 10px 5px 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.8);
    }
    .pharaoh-hat::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 10px; right: 10px;
      height: 6px;
      background: var(--gold);
      border-radius: 3px;
    }

    /* الأيدي الصغيرة المزحة */
    .p-hand {
      position: absolute;
      width: 10px;
      height: 18px;
      background: var(--gold);
      border-radius: 5px;
      top: 45px;
      transition: transform 0.2s;
    }
    .p-hand-l { left: -12px; }
    .p-hand-r { right: -12px; }
    .p-hand.moving {
      transform: translateY(-8px) rotate(15deg);
    }

    /* عيون الروبوت الفرعوني */
    .p-eyes {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .p-eye {
      width: 10px;
      height: 12px;
      background: var(--gold);
      border-radius: 50%;
    }

    /* فقاعة الكلام التلقائي */
    .pharaoh-bubble {
      position: absolute;
      bottom: 95px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 15, 0.95);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 11px;
      white-space: nowrap;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 950;
    }
    .pharaoh-bubble.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- خلفية الفضاء -->
  <canvas id="bgCanvas"></canvas>

  <!-- ⚰️ التابوت الأسطوري - رابط الفيسبوك للمصمم -->
  <div class="coffin-widget" onclick="openCoffinModal()">
    <div class="coffin-icon">⚰️</div>
    <div class="coffin-label">المصمم</div>
  </div>

  <!-- نافذة التابوت المنبثقة -->
  <div class="coffin-modal-overlay" id="coffinModal">
    <div class="coffin-modal-card">
      <div style="font-size: 40px; margin-bottom: 10px;">⚰️✨</div>
      <h3 style="color: var(--gold); margin-bottom: 8px;">لمسة المصمم الإبداعية</h3>
      <p style="font-size: 13px; color: #aaa; line-height: 1.6;">
        تم تطوير وتصميم هذه الصفحة بواسطة <strong>السفاح</strong>. انقر للتواصل والمتابعة على الفيسبوك.
      </p>
      <a href="https://www.facebook.com/LONLY8" target="_blank" class="fb-btn">
        زيارة حساب الفيسبوك
      </a>
      <div style="margin-top: 15px;">
        <button class="btn" style="padding: 6px 15px; font-size: 12px;" onclick="closeCoffinModal()">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- المحتوى الرئيسي -->
  <div class="app-container">
    <div class="card">
      <h2 style="text-align: center; color: var(--gold); margin-bottom: 15px;">مملكة الحكماء الفراعنة 🏛️</h2>
      
      <div class="quote-display">
        <p class="quote-text" id="quoteText">"الحكمة تبدأ من الهدوء، وتستمر بالتأمل الصامت."</p>
        <span style="font-size: 13px; color: var(--gold);" id="quoteAuthor">— إرث الأجداد</span>
      </div>

      <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
        <button class="btn" onclick="changeQuote()">حكمة جديدة 📜</button>
      </div>

      <input type="text" class="input-field" placeholder="اكتب شيئاً هنا لتراقب تعليقات الروبوتات الفراعنة..." id="userInput" oninput="userIsTyping()">
    </div>
  </div>

  <!-- 🤖 الروبوت الفرعوني الأول (حورس الأسود) -->
  <div class="pharaoh-robot" id="pharaoh1" style="top: 150px; left: 50px;">
    <div class="pharaoh-bubble" id="bubble1">أنا حورس الحكيم!</div>
    <div class="pharaoh-wrapper">
      <div class="pharaoh-hat"></div>
      <div class="p-hand p-hand-l" id="hand1L"></div>
      <div class="p-hand p-hand-r" id="hand1R"></div>
      <div class="p-eyes">
        <div class="p-eye"></div>
        <div class="p-eye"></div>
      </div>
    </div>
  </div>

  <!-- 🤖 الروبوت الفرعوني الثاني (أنوبيس الأسود) -->
  <div class="pharaoh-robot" id="pharaoh2" style="top: 250px; right: 50px;">
    <div class="pharaoh-bubble" id="bubble2">وأنا أنوبيس!</div>
    <div class="pharaoh-wrapper">
      <div class="pharaoh-hat"></div>
      <div class="p-hand p-hand-l" id="hand2L"></div>
      <div class="p-hand p-hand-r" id="hand2R"></div>
      <div class="p-eyes">
        <div class="p-eye"></div>
        <div class="p-eye"></div>
      </div>
    </div>
  </div>

  <script>
    // نافذة التابوت
    function openCoffinModal() { document.getElementById('coffinModal').style.display = 'flex'; }
    function closeCoffinModal() { document.getElementById('coffinModal').style.display = 'none'; }

    // الحكم والاقتباسات
    const quotes = [
      { text: "الحكمة تبدأ من الهدوء، وتستمر بالتأمل الصامت.", author: "إرث الأجداد" },
      { text: "الزمن لا ينتظر أحداً، اجعل خطواتك ثابتة كالأهرامات.", author: "فلسفة فرعونية" },
      { text: "في القلوب النقية تكمن أسرار الملوك.", author: "حكمة العظماء" }
    ];
    function changeQuote() {
      const q = quotes[Math.floor(Math.random() * quotes.length)];
      document.getElementById('quoteText').innerText = `"${q.text}"`;
      document.getElementById('quoteAuthor').innerText = `— ${q.author}`;
    }

    // 🤖 محادثات الروبوتات التلقائية والتعليق على المستخدم
    const comments = [
      "يا لها من خطوة ذكية يا صديقي!",
      "هل تبحث عن كنز مفقود في الشاشة؟",
      "أعجبني ما تكتبه، تابع الإبداع!",
      "نحن نراقب كل حركاتك يا بطل ههههه!",
      "التصميم الأسود والذهبي يليق بك حقاً!"
    ];

    function showRandomComment() {
      const c1 = comments[Math.floor(Math.random() * comments.length)];
      const c2 = comments[Math.floor(Math.random() * comments.length)];
      
      triggerBubble('bubble1', c1);
      setTimeout(() => triggerBubble('bubble2', c2), 3000);
      
      // تحريك الأيدي المزحة
      document.getElementById('hand1L').classList.add('moving');
      document.getElementById('hand2R').classList.add('moving');
      setTimeout(() => {
        document.getElementById('hand1L').classList.remove('moving');
        document.getElementById('hand2R').classList.remove('moving');
      }, 600);
    }

    function userIsTyping() {
      triggerBubble('bubble1', "أنت تكتب شيئاً مثيراً للاهتمام!");
    }

    function triggerBubble(id, text) {
      const b = document.getElementById(id);
      b.innerText = text;
      b.classList.add('visible');
      setTimeout(() => b.classList.remove('visible'), 4000);
    }

    setInterval(showRandomComment, 10000);

    // 🖐️ نظام تحريك الروبوتات باليد (Drag & Drop / Touch)
    function makeDraggable(elm) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      elm.onmousedown = dragMouseDown;
      elm.ontouchstart = dragTouchDown;

      function dragMouseDown(e) {
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elm.style.top = (elm.offsetTop - pos2) + "px";
        elm.style.left = (elm.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }

      function dragTouchDown(e) {
        pos3 = e.touches[0].clientX;
        pos4 = e.touches[0].clientY;
        document.ontouchend = closeTouchElement;
        document.ontouchmove = elementTouchDrag;
      }

      function elementTouchDrag(e) {
        pos1 = pos3 - e.touches[0].clientX;
        pos2 = pos4 - e.touches[0].clientY;
        pos3 = e.touches[0].clientX;
        pos4 = e.touches[0].clientY;
        elm.style.top = (elm.offsetTop - pos2) + "px";
        elm.style.left = (elm.offsetLeft - pos1) + "px";
      }

      function closeTouchElement() {
        document.ontouchend = null;
        document.ontouchmove = null;
      }
    }

    makeDraggable(document.getElementById('pharaoh1'));
    makeDraggable(document.getElementById('pharaoh2'));

    // 🌌 خلفية النجوم Canvas
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Star {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.5;
        this.alpha = Math.random();
      }
      draw() {
        ctx.fillStyle = `rgba(212, 175, 55, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 50; i++) particles.push(new Star());
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => p.draw());
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
