<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚠️ CRITICAL SYSTEM FAILURE ⚠️</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #000000;
      color: #ff0000;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      text-align: center;
      overflow-x: hidden;
      user-select: none;
    }

    /* تأثير وميض الشاشة عند التفاعل */
    .flash-red {
      animation: screenFlash 0.4s infinite alternate;
    }

    @keyframes screenFlash {
      0% { background-color: #000000; }
      100% { background-color: #2b0000; }
    }

    .alert-header {
      border: 3px solid #ff0000;
      padding: 15px;
      background-color: rgba(255, 0, 0, 0.2);
      box-shadow: 0 0 25px #ff0000;
      width: 100%;
      max-width: 500px;
      border-radius: 10px;
      margin-top: 10px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 10px 0;
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000;
    }

    /* شريط التقدم للفرمتة */
    .progress-box {
      width: 100%;
      max-width: 500px;
      background: #111;
      border: 2px solid #ff0000;
      border-radius: 8px;
      margin: 15px 0;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    }

    .progress-bar {
      width: 0%;
      height: 25px;
      background: linear-gradient(90deg, #880000, #ff0000);
      transition: width 0.3s ease;
    }

    .status-text {
      color: #ffcc00;
      font-weight: bold;
      font-size: 14px;
      margin: 10px 0;
    }

    /* سجل الاختراق المباشر */
    .terminal-logs {
      width: 100%;
      max-width: 500px;
      background: #080000;
      border: 1px solid #ff0000;
      padding: 10px;
      text-align: right;
      font-size: 12px;
      color: #00ff00;
      height: 120px;
      overflow-y: auto;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .log-danger {
      color: #ff3333;
    }

    /* صندوق الفدية */
    .ransom-box {
      border: 2px dashed #ffcc00;
      background-color: rgba(255, 204, 0, 0.1);
      padding: 12px;
      width: 100%;
      max-width: 500px;
      border-radius: 8px;
      color: #ffcc00;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .repeating-names {
      font-size: 11px;
      color: #ff2222;
      opacity: 0.8;
      word-wrap: break-word;
      line-height: 1.6;
    }

    .touch-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 18px;
      z-index: 9999;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- شاشة البدء للتفاعل واستغلال برمجيات الصوت والاهتزاز -->
  <div class="touch-overlay" id="overlay">
    🚨 اضغط هنا لفك حظر النظام 🚨
  </div>

  <div class="alert-header">
    <h1>⚠️ تم اختراق الهاتف بالكامل ⚠️</h1>
    <p>المخترق المسؤول: <strong style="color: #ffffff; font-size: 18px;">السفاح</strong></p>
  </div>

  <div class="status-text" id="timer-status">
    جاري تهيئة مسح الذاكرة والصور... (10 ثوانٍ)
  </div>

  <div class="progress-box">
    <div class="progress-bar" id="pbar"></div>
  </div>

  <div class="terminal-logs" id="logs">
    [+] بدء الاتصال بسيرفر السفاح...<br>
    [+] تم سحب حزم البيانات...<br>
  </div>

  <div class="ransom-box">
    🍔 **شرط فك القفل وتوقف الفرمتة:**<br>
    أرسل وجبة غداء فاخرة لـ <strong>السفاح</strong> فوراً لإلغاء العملية!
  </div>

  <div class="repeating-names" id="stream"></div>

  <script>
    const name = "السفاح";
    let progress = 0;
    let timeLeft = 10;
    let audioCtx = null;
    let alarmInterval = null;

    // تكرار اسم السفاح في الخلفية
    const stream = document.getElementById("stream");
    let nameText = "";
    for(let i=0; i<100; i++) {
      nameText += `🚨 SYSTEM HACKED BY: ${name} 🚨 &nbsp; `;
    }
    stream.innerHTML = nameText;

    // إنتاج صوت إنذار برمي محاكي
    function playBeep() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(900, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    // إضافة أسطر في سجل الأوامر
    function addLog(text, isDanger = false) {
      const logs = document.getElementById("logs");
      const className = isDanger ? "log-danger" : "";
      logs.innerHTML += `<div class="${className}">> ${text}</div>`;
      logs.scrollTop = logs.scrollHeight;
    }

    // تشغيل المقلب عند الضغط الأول
    document.getElementById("overlay").addEventListener("click", function() {
      this.style.display = "none";
      document.body.classList.add("flash-red");

      // تشغيل اهتزاز الهاتف
      if ("vibrate" in navigator) {
        navigator.vibrate([300, 100, 300, 100, 500, 200, 500]);
      }

      // تشغيل صوت الإنذار كل 500ms
      alarmInterval = setInterval(playBeep, 500);

      // سجلات وهمية سريعة
      setTimeout(() => addLog("تم فتح الكاميرا الأمامية والتقاط صورة 📸", true), 1000);
      setTimeout(() => addLog("تم تحديد موقع الهاتف عبر الـ GPS 📍", true), 2000);
      setTimeout(() => addLog("جاري تنزيل ألبوم الصور والمحادثات... 📁", true), 3500);

      // عداد الفرمتة
      const timer = setInterval(() => {
        timeLeft--;
        progress += 10;
        document.getElementById("pbar").style.width = progress + "%";
        document.getElementById("timer-status").innerText = `جاري مسح الصور والملفات... بقي (${timeLeft} ثوانٍ)`;

        // اهتزاز خفيف مع كل ثانية
        if ("vibrate" in navigator) navigator.vibrate(150);

        if (timeLeft <= 0) {
          clearInterval(timer);
          clearInterval(alarmInterval);
          document.body.classList.remove("flash-red");
          document.getElementById("timer-status").innerHTML = "🎉 <strong style='color:#00ff00; font-size:18px;'>تمت الفرمتة بنجاح! تعيش وتاكل غيرها هههههه (مجرد مقلب) 🤣</strong>";
          addLog("حفظ الله جهازك! المقلب انتهى بنجاح ❤️");
        }
      }, 1000);
    });
  </script>
</body>
</html>
