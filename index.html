<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>مملكة الاقتباسات 🌙</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

body{
    background:#050508;
    color:#eee;
    font-family:Tajawal,sans-serif;
    min-height:100vh;
    padding:20px 15px 120px;
    overflow-x:hidden;
}

#bgCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:-1;
    pointer-events:none;
}

button,input,textarea,select{
    font-family:Tajawal,sans-serif;
}

.login-card,
.quote-box,
.modal-content{
    background:rgba(15,15,24,.88);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}

.login-card{
    width:100%;
    max-width:430px;
    margin:10vh auto 0;
    padding:35px 25px;
    border-radius:22px;
    text-align:center;
    box-shadow:0 20px 60px #000;
}

.login-card h2{
    color:#fff;
    margin-bottom:10px;
}

.login-card p{
    color:#888;
    font-size:13px;
    line-height:1.7;
    margin-bottom:25px;
}

.input-group{
    width:100%;
}

.input-group input,
.input-group textarea,
.input-group select{
    width:100%;
    padding:13px 15px;
    margin-bottom:12px;
    background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    color:#fff;
    outline:none;
}

.input-group textarea{
    resize:vertical;
    user-select:text;
}

.input-group input:focus,
.input-group textarea:focus,
.input-group select:focus{
    border-color:#9d4edd;
    box-shadow:0 0 15px rgba(157,78,221,.25);
}

.btn{
    border:0;
    border-radius:11px;
    padding:12px 18px;
    color:white;
    cursor:pointer;
    background:linear-gradient(135deg,#4a127a,#7b2cbf);
    box-shadow:0 5px 18px rgba(123,44,191,.3);
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
}

.secondary-btn{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
}

.main-app{
    display:none;
    width:100%;
    max-width:700px;
    margin:auto;
}

.header-user{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
    padding-bottom:15px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.user-badge{
    color:#c77dff;
    font-size:14px;
}

.header-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.icon-btn{
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05);
    color:#ccc;
    border-radius:8px;
    padding:7px 10px;
    cursor:pointer;
    font-size:11px;
}

.quote-box{
    position:relative;
    width:100%;
    min-height:280px;
    border-radius:22px;
    padding:45px 25px 30px;
    text-align:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow:0 20px 50px #000;
    transition:.3s;
}

.quote-tag{
    position:absolute;
    top:15px;
    right:18px;
    color:#c77dff;
    background:rgba(157,78,221,.13);
    border:1px solid rgba(157,78,221,.3);
    border-radius:15px;
    padding:4px 10px;
    font-size:11px;
}

.quote-text{
    font-family:Amiri,serif;
    font-size:25px;
    line-height:1.9;
    margin-bottom:12px;
    color:#fff;
}

.quote-author{
    color:#9d4edd;
    font-size:13px;
    margin-bottom:25px;
}

.quote-actions-bar{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.action-pill{
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05);
    color:#ddd;
    border-radius:20px;
    padding:8px 13px;
    cursor:pointer;
    font-size:12px;
}

.action-pill.liked{
    color:#ff2a6d;
    border-color:#ff2a6d;
    background:rgba(255,42,109,.12);
}

.controls-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:15px 0;
}

.search-box{
    position:relative;
    margin-bottom:12px;
}

.search-input{
    width:100%;
    padding:12px 42px 12px 15px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    color:#fff;
    outline:none;
    user-select:text;
}

.search-icon{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:#777;
}

.filter-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.filter-btn{
    border:0;
    background:transparent;
    color:#777;
    padding:6px 9px;
    cursor:pointer;
    border-radius:7px;
    font-size:12px;
}

.filter-btn.active{
    color:#c77dff;
    background:rgba(199,125,255,.1);
}

.quotes-grid{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.mini-quote-card{
    background:rgba(255,255,255,.025);
    border-right:3px solid #7b2cbf;
    border-radius:0 12px 12px 0;
    padding:15px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    color:#ccc;
    line-height:1.7;
}

.mini-quote-content{
    flex:1;
}

.mini-quote-author{
    display:block;
    margin-top:5px;
    color:#777;
    font-size:10px;
}

.delete-btn{
    border:0;
    background:none;
    color:#ff4757;
    cursor:pointer;
    font-size:11px;
}

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(8px);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:100;
    padding:15px;
}

.modal-content{
    width:100%;
    max-width:480px;
    padding:25px;
    border-radius:18px;
}

.modal-content h3{
    color:#fff;
    margin-bottom:15px;
}

.robots-container{
    position:fixed;
    z-index:90;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:5px;
    touch-action:none;
}

.robots-bubbles-row{
    display:flex;
    gap:8px;
}

.robot-bubble{
    opacity:0;
    transform:translateY(10px);
    transition:.3s;
    background:rgba(15,15,25,.95);
    border:1px solid rgba(157,78,221,.4);
    color:#ddd;
    padding:8px 10px;
    border-radius:12px;
    max-width:170px;
    font-size:10px;
    line-height:1.5;
}

.robot-bubble.active{
    opacity:1;
    transform:translateY(0);
}

.robot-bubble.female{
    color:#ffb3c6;
    border-color:rgba(255,42,109,.5);
}

.robots-avatars-row{
    display:flex;
    gap:10px;
    cursor:grab;
}

.robot-card{
    text-align:center;
}

.robot-avatar{
    width:56px;
    height:56px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle,#1a1a28,#08080d);
    border:2px solid rgba(157,78,221,.5);
    box-shadow:0 0 18px rgba(123,44,191,.5);
    position:relative;
}

.robot-avatar.female{
    border-color:#ff2a6d;
}

.robot-eyes{
    display:flex;
    gap:8px;
}

.eye{
    width:13px;
    height:16px;
    border:1px solid #7b2cbf;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.eye.female-eye{
    border-color:#ff2a6d;
}

.pupil{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#00f0ff;
    box-shadow:0 0 10px #00f0ff;
}

.female-pupil{
    background:#ff2a6d;
    box-shadow:0 0 10px #ff2a6d;
}

.robot-antenna{
    position:absolute;
    top:-9px;
    width:2px;
    height:8px;
    background:#7b2cbf;
}

.robot-antenna::after{
    content:"";
    position:absolute;
    top:-4px;
    left:-2px;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#00f0ff;
}

.female-antenna{
    background:#ff2a6d;
}

.female-antenna::after{
    background:#ff2a6d;
}

.robot-bow{
    position:absolute;
    top:-7px;
    right:2px;
}

.robot-label{
    color:#aaa;
    font-size:9px;
}

@media(max-width:600px){
    .header-user{
        align-items:flex-start;
        flex-direction:column;
    }

    .header-actions{
        width:100%;
    }

    .icon-btn{
        flex:1;
    }

    .quote-text{
        font-size:21px;
    }

    .controls-grid{
        grid-template-columns:1fr;
    }

    .robots-container{
        transform:scale(.85);
        transform-origin:bottom right;
    }
}
</style>
</head>

<body>

<canvas id="bgCanvas"></canvas>

<!-- تسجيل الدخول -->
<div class="login-card" id="loginCard">

    <h2>مملكة الاقتباسات 🌙</h2>

    <p>
        اصنع مساحتك الخاصة، احفظ اقتباساتك،
        واكتشف كلمات جديدة كل يوم.
    </p>

    <div class="input-group">

        <input
            type="text"
            id="nicknameInput"
            maxlength="20"
            placeholder="اكتب لقبك..."
        >

        <input
            type="password"
            id="passwordInput"
            maxlength="30"
            placeholder="كلمة السر..."
        >

    </div>

    <button
        class="btn"
        style="width:100%"
        onclick="handleAuth()"
    >
        دخول / إنشاء حساب
    </button>

</div>


<!-- التطبيق -->
<div class="main-app" id="mainApp">

    <div class="header-user">

        <div class="user-badge">
            ✨ أهلاً بك:
            <strong id="userNickname" style="color:#fff">
                الزائر
            </strong>
        </div>

        <div class="header-actions">

            <button
                class="icon-btn"
                id="ambientAudioBtn"
                onclick="toggleAmbientSound()"
            >
                أجواء 🎧
            </button>

            <button
                class="icon-btn"
                onclick="openRobotChat()"
            >
                الروبوتات 🤖
            </button>

            <button
                class="icon-btn"
                onclick="logout()"
            >
                خروج
            </button>

        </div>

    </div>


    <!-- الاقتباس الرئيسي -->
    <div class="quote-box" id="quoteBox">

        <span class="quote-tag" id="quoteCategory">
            فلسفة
        </span>

        <p class="quote-text" id="quoteText">
            "في الهدوء تجد العقول العظيمة ملجأها."
        </p>

        <span class="quote-author" id="quoteAuthor">
            — مجهول
        </span>

        <div class="quote-actions-bar">

            <button
                class="action-pill"
                id="mainLikeBtn"
                onclick="toggleMainLike()"
            >
                ❤️ <span id="mainLikeCount">0</span>
            </button>

            <button
                class="action-pill"
                onclick="speakQuote()"
            >
                🎙️ استماع
            </button>

            <button
                class="action-pill"
                onclick="copyQuote()"
            >
                📋 نسخ
            </button>

            <button
                class="action-pill"
                onclick="shareQuote()"
            >
                📤 مشاركة
            </button>

            <button
                class="action-pill"
                onclick="downloadQuoteImage()"
            >
                🖼️ صورة
            </button>

        </div>

    </div>


    <div class="controls-grid">

        <button
            class="btn"
            onclick="getRandomQuote()"
        >
            🎲 اقتباس عشوائي
        </button>

        <button
            class="btn secondary-btn"
            onclick="openAddModal()"
        >
            ✍️ نشر اقتباس
        </button>

    </div>


    <!-- البحث -->
    <div class="search-box">

        <span class="search-icon">🔍</span>

        <input
            class="search-input"
            id="searchInput"
            placeholder="ابحث في المملكة..."
            oninput="renderArchive()"
        >

    </div>


    <div class="filter-bar">

        <span
            id="resultsCount"
            style="color:#888;font-size:12px"
        >
            المكتبة
        </span>

        <div>

            <button
                class="filter-btn active"
                id="filterAll"
                onclick="setFilter('all')"
            >
                الكل
            </button>

            <button
                class="filter-btn"
                id="filterLiked"
                onclick="setFilter('liked')"
            >
                ❤️ المفضلة
            </button>

            <button
                class="filter-btn"
                id="filterMine"
                onclick="setFilter('mine')"
            >
                ✍️ اقتباساتي
            </button>

        </div>

    </div>


    <div
        class="quotes-grid"
        id="quotesGrid"
    ></div>

</div>


<!-- الروبوتات -->
<div
    class="robots-container"
    id="robotsContainer"
>

    <div class="robots-bubbles-row">

        <div
            class="robot-bubble"
            id="bubbleAthir"
        >
            أثير: مرحباً 👁️
        </div>

        <div
            class="robot-bubble female"
            id="bubbleAthira"
        >
            أثيرة: أهلاً 🌸
        </div>

    </div>


    <div
        class="robots-avatars-row"
        id="robotsDragArea"
    >

        <div class="robot-card">

            <div
                class="robot-avatar"
                onclick
