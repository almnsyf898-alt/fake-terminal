<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>حكيم الصمت | The Wise Man</title>
  <style>
    body {
      background-color: #0d0d0d;
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ccc;
    }

    /* 🧠 الشخصية (الحكيم) */
    #wise-man {
      position: fixed;
      width: 80px;
      height: 140px;
      cursor: grab;
      touch-action: none;
      z-index: 100;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    /* أجزاء الجسم */
    .head { width: 40px; height: 40px; background: #555; border-radius: 50%; margin: 0 auto; border: 2px solid #333; }
    .torso { width: 50px; height: 60px; background: #222; border-radius: 15px; margin: -5px auto; }
    .arm { width: 10px; height: 40px; background: #333; position: absolute; top: 35px; border-radius: 5px; }
    .arm.left { left: -5px; transform: rotate(15deg); }
    .arm.right { right: -5px; transform: rotate(-15deg); }
    .leg { width: 12px; height: 40px; background: #333; position: absolute; bottom: 0; border-radius: 5px; }
    .leg.left { left: 10px; }
    .leg.right { right: 10px; }

    /* فقاعة الكلام */
    #speech {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
      color: #fff;
    }

    #speech.visible { opacity: 1; }

    /* نص ترحيبي خفيف */
    .hint { position: fixed; bottom: 20px; font-size: 12px; color: #444; }
  </style>
</head>
<body>

  <div class="hint">اسحب الحكيم بيدك..</div>

  <!-- الشخصية -->
  <div id="wise-man" style="top: 200px; left: 150px;">
    <div id="speech">أنا هنا لأشاركك الصمت..</div>
    <div class="head"></div>
    <div class="torso">
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
    </div>
  </div>

  <script>
    // الحكم
    const wisdoms = [
      "في هدوء النفس، تكمن كل الإجابات.",
      "لا تستعجل الحياة، فالأشجار تنمو ببطء.",
      "الصمت هو لغة العقول الراقية.",
      "أنت تمضي في طريقك، وهذا يكفي.",
      "كل يوم هو صفحة جديدة في كتابك.",
      "تأمل النجوم، فهي تخبرنا الكثير."
    ];

    function showWisdom() {
      const speech = document.getElementById('speech');
      speech.innerText = wisdoms[Math.floor(Math.random() * wisdoms.length)];
      speech.classList.add('visible');
      setTimeout(() => speech.classList.remove('visible'), 4000);
    }

    setInterval(showWisdom, 7000); // يتحدث كل 7 ثواني

    // تحريك الشخصية
    const man = document.getElementById('wise-man');
    let isDragging = false;

    function move(e) {
      const x = e.clientX || e.touches[0].clientX;
      const y = e.clientY || e.touches[0].clientY;
      man.style.left = (x - 40) + 'px';
      man.style.top = (y - 70) + 'px';
    }

    man.onmousedown = () => { document.onmousemove = move; };
    man.ontouchstart = () => { document.ontouchmove = (e) => move(e.touches[0]); };
    document.onmouseup = () => { document.onmousemove = null; };
    document.ontouchend = () => { document.ontouchmove = null; };

  </script>
</body>
</html>
