<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عالم الاقتباسات | Dark Aesthetic</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #08080c;
      color: #e0e0e0;
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      background: radial-gradient(circle at center, #12121a 0%, #050508 100%);
    }

    /* شاشة تسجيل الدخول */
    .login-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      padding: 35px 25px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .login-card h2 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .login-card p {
      font-size: 13px;
      color: #888;
      margin-bottom: 25px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid #2a2a35;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      outline: none;
      text-align: center;
      margin-bottom: 15px;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #7b2cbf;
      box-shadow: 0 0 10px rgba(123, 44, 191, 0.3);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #5a189a, #7b2cbf);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    /* واجهة الاقتباسات الرئيسية */
    .main-app {
      display: none;
      width: 100%;
      max-width: 650px;
      flex-direction: column;
      align-items: center;
    }

    .header-user {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .user-badge {
      font-size: 16px;
      color: #c77dff;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #aaa;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .quote-box {
      background: rgba(20, 20, 28, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 40px 30px;
      text-align: center;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      margin-bottom: 25px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease;
    }

    .quote-text {
      font-family: 'Amiri', serif;
      font-size: 22px;
      line-height: 1.8;
      color: #f1f1f1;
      margin-bottom: 15px;
    }

    .quote-author {
      font-size: 13px;
      color: #9d4edd;
      font-style: italic;
    }

    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-bottom: 30px;
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ddd;
    }

    /* قائمة الأرشيف الكامل */
    .quotes-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .grid-title {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
      text-align: right;
      width: 100%;
    }

    .mini-quote-card {
      background: rgba(255, 255, 255, 0.02);
      border-right: 3px solid #7b2cbf;
      padding: 15px;
      border-radius: 0 8px 8px 0;
      font-size: 14px;
      color: #bbb;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div class="login-card" id="loginCard">
    <h2>عالم الأسرار 🌙</h2>
    <p>أدخل لقبك الخاص للانضمام للرحلة</p>
    <div class="input-group">
      <input type="text" id="nicknameInput" placeholder="اكتب لقبك هنا..." maxlength="20">
    </div>
    <button class="btn" onclick="login()">دخول</button>
  </div>

  <!-- الواجهة الرئيسية -->
  <div class="main-app" id="mainApp">
    <div class="header-user">
      <div class="user-badge">مرحباً بك، <span id="userNickname">الزائر</span> ✨</div>
      <button class="logout-btn" onclick="logout()">تغيير اللقب</button>
    </div>

    <div class="quote-box" id="quoteBox">
      <p class="quote-text" id="quoteText">"في الهدوء تجد العقول العظيمة ملجأها."</p>
      <span class="quote-author" id="quoteAuthor">— مجهول</span>
    </div>

    <div class="controls">
      <button class="btn" onclick="getRandomQuote()">اقتباس عشوائي 🎲</button>
      <button class="btn secondary-btn" onclick="copyQuote()">نسخ 📋</button>
    </div>

    <div class="grid-title">مكتبة الاقتباسات المختارة:</div>
    <div class="quotes-grid" id="quotesGrid"></div>
  </div>

  <script>
    const quotes = [
      { text: "الظلام ليس سوى غياب للنور، والصمت ليس سوى مساحة للتفكير العميق.", author: "فلسفة الهدوء" },
      { text: "قد تجد في العزلة ما لا تجده في زحمة العابرين.", author: "حكمة قديمة" },
      { text: "سيكون كل شيء جميلاً، ربما ليس اليوم ولكن حتماً في يوم ما.", author: "أمل" },
      { text: "لا تزن نفسك بمقياس غيرك، لكل نجم في السماء بريقه الخاص.", author: "تأملات" },
      { text: "الهدوء فن، لا يتقنه إلا من تعلم كيف يصمت وفي قلبه عاصفة.", author: "أدب الشوارع" },
      { text: "نحن نعيش في عالم يمتلئ بالضجيج، ابحث دائماً عن بقعة سلامك الخاص.", author: "مجهول" },
      { text: "الذين يسيرون في الطرقات المظلمة هم أول من يلمح النجوم.", author: "عالم الأسرار" },
      { text: "كل نهاية هي مجرد بداية لقصة جديدة لم تُكتب بعد.", author: "مسارات الحياة" },
      { text: "أحياناً تكون القوة في عدم الرد، وفي الابتعاد بتكتم.", author: "نفسيات" }
    ];

    function login() {
      const name = document.getElementById('nicknameInput').value.trim();
      if (!name) return alert('يرجى كتابة لقبك أولاً!');

      localStorage.setItem('aesthetic_user', name);
      showApp(name);
    }

    function showApp(name) {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('mainApp').style.display = 'flex';
      document.getElementById('userNickname').innerText = name;
      
      renderArchive();
      getRandomQuote();
    }

    function logout() {
      localStorage.removeItem('aesthetic_user');
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('mainApp').style.display = 'none';
    }

    function getRandomQuote() {
      const box = document.getElementById('quoteBox');
      box.style.opacity = 0;
      
      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * quotes.length);
        document.getElementById('quoteText').innerText = `"${quotes[randomIndex].text}"`;
        document.getElementById('quoteAuthor').innerText = `— ${quotes[randomIndex].author}`;
        box.style.opacity = 1;
      }, 300);
    }

    function copyQuote() {
      const text = document.getElementById('quoteText').innerText;
      navigator.clipboard.writeText(text);
      alert('تم نسخ الاقتباس بنجاح!');
    }

    function renderArchive() {
      const grid = document.getElementById('quotesGrid');
      grid.innerHTML = '';
      quotes.forEach(q => {
        const card = document.createElement('div');
        card.className = 'mini-quote-card';
        card.innerText = `"${q.text}"`;
        grid.appendChild(card);
      });
    }

    // الفحص التلقائي إذا كان مسجلاً من قبل
    window.onload = () => {
      const savedUser = localStorage.getItem('aesthetic_user');
      if (savedUser) {
        showApp(savedUser);
      }
    };
  </script>
</body>
</html>
